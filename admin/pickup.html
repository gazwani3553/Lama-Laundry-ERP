<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<meta
    name="description"
    content="إدارة عمليات الاستلام - Lama Laundry ERP">

<meta
    name="theme-color"
    content="#0d6efd">

<title>الاستلام | Lama Laundry ERP</title>

<link
    rel="icon"
    type="image/png"
    href="../assets/images/favicon.png">

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="../assets/css/main.css">

<link
    rel="stylesheet"
    href="../assets/css/pickup.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">

<img
    src="../assets/images/logo.png"
    alt="Lama Laundry ERP Logo"
    loading="lazy">

<h2>Lama ERP</h2>

</div>

<nav>

<a href="dashboard.html">
<i class="fas fa-chart-line"></i>
<span>الرئيسية</span>
</a>

<a href="orders.html">
<i class="fas fa-basket-shopping"></i>
<span>الطلبات</span>
</a>

<a href="customers.html">
<i class="fas fa-users"></i>
<span>العملاء</span>
</a>

<a
href="pickup.html"
class="active"
aria-current="page">
<i class="fas fa-truck-pickup"></i>
<span>الاستلام</span>
</a>

<a href="delivery.html">
<i class="fas fa-truck-fast"></i>
<span>التوصيل</span>
</a>

<a href="inventory.html">
<i class="fas fa-boxes-stacked"></i>
<span>المخزون</span>
</a>

<a href="employees.html">
<i class="fas fa-user-tie"></i>
<span>الموظفون</span>
</a>

<a href="reports.html">
<i class="fas fa-chart-pie"></i>
<span>التقارير</span>
</a>

<a href="settings.html">
<i class="fas fa-gear"></i>
<span>الإعدادات</span>
</a>

</nav>

</aside>

<main class="content">

<header class="topbar">

    <div>

        <h1>طلبات الاستلام</h1>

        <p>إدارة عمليات استلام الملابس من العملاء</p>

    </div>

    <div class="actions">

        <button
            id="refreshPickup"
            type="button"
            aria-label="تحديث عمليات الاستلام">

            <i class="fas fa-rotate"></i>

            تحديث

        </button>

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
            aria-label="تسجيل الخروج">

            <i class="fas fa-right-from-bracket"></i>

            تسجيل الخروج

        </button>


    </div>

</header>

<!-- بطاقات الإحصائيات -->

<section class="cards">

    <div class="card">

        <h2 id="pickupCount">0</h2>

        <span>إجمالي الطلبات</span>

    </div>

    <div class="card">

        <h2 id="waitingPickup">0</h2>

<span>بانتظار الاستلام</span>

    </div>

    <div class="card">

        <h2 id="completedPickup">0</h2>

        <span>قيد الغسيل</span>
    </div>

</section>

<!-- أدوات البحث -->

<section class="toolbar">

    <input
        id="searchPickup"
        type="search"
        autocomplete="off"
        placeholder="بحث برقم الطلب أو اسم العميل أو الجوال">

    <select id="pickupFilter">

        <option value="">كل الحالات</option>

        <option value="طلب جديد">طلب جديد</option>

<option value="بانتظار الاستلام">بانتظار الاستلام</option>

<option value="في الطريق">في الطريق</option>

    </select>

</section>

<!-- جدول عمليات الاستلام -->

<section class="table-section">

    <table class="pickup-table">

        <thead>

            <tr>

                <th>رقم الطلب</th>
                <th>اسم العميل</th>
                <th>الجوال</th>
                <th>العنوان</th>
                <th>السائق</th>
                <th>موعد الاستلام</th>
                <th>الحالة</th>
                <th>الإجراءات</th>

            </tr>

        </thead>

        <tbody id="pickupTableBody">

            <!-- pickup.js -->

        </tbody>

    </table>

</section>
</main>

</div>

<script type="module" src="../assets/js/pickup.js"></script>

</body>

</html>
