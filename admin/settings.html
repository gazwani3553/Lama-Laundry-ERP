<main class="content">

<header class="topbar">

    <div>

        <h1>إعدادات النظام</h1>

        <p>إدارة إعدادات المغسلة والفواتير والنسخ الاحتياطي</p>

    </div>

    <div class="actions">

        <button
            id="saveSettings"
            class="primary"
            type="button"
            aria-label="حفظ الإعدادات">

            <i class="fas fa-floppy-disk"></i>

            حفظ الإعدادات

        </button>

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
            aria-label="تسجيل الخروج">

            <i class="fas fa-right-from-bracket"></i>

            تسجيل الخروج

        </button>

    </div>

</header>

<section class="settings-grid">

    <!-- بيانات المغسلة -->

    <div class="setting-card">

        <h3>بيانات المغسلة</h3>

        <div class="field">

            <label for="laundryName">

                اسم المغسلة

            </label>

            <input
                id="laundryName"
                type="text">

        </div>

        <div class="field">

            <label for="laundryPhone">

                رقم الجوال

            </label>

            <input
                id="laundryPhone"
                type="tel">

        </div>

        <div class="field">

            <label for="laundryAddress">

                العنوان

            </label>

            <input
                id="laundryAddress"
                type="text">

        </div>

    </div>

    <!-- إعدادات الفاتورة -->

    <div class="setting-card">

        <h3>إعدادات الفاتورة</h3>

        <div class="field">

            <label for="invoicePrefix">

                بادئة رقم الفاتورة

            </label>

            <input
                id="invoicePrefix"
                type="text">

        </div>

        <div class="field">

            <label for="vatRate">

                نسبة الضريبة (%)

            </label>

            <input
                id="vatRate"
                type="number"
                min="0"
                max="100"
                step="0.01">

        </div>

        <div class="field">

            <label for="currency">

                العملة

            </label>

            <input
                id="currency"
                type="text">

        </div>

    </div>

    <!-- إعدادات النظام -->

    <div class="setting-card">

        <h3>إعدادات النظام</h3>

        <div class="field">

            <label for="systemLanguage">

                اللغة

            </label>

            <select id="systemLanguage">

                <option value="ar">العربية</option>

                <option value="en">English</option>

            </select>

        </div>

        <div class="field">

            <label for="themeMode">

                المظهر

            </label>

            <select id="themeMode">

                <option value="light">فاتح</option>

                <option value="dark">داكن</option>

            </select>

        </div>

        <div class="field">

            <label for="autoPrint">

                الطباعة التلقائية

            </label>

            <select id="autoPrint">

                <option value="yes">نعم</option>

                <option value="no">لا</option>

            </select>

        </div>

    </div>

    <!-- النسخ الاحتياطي -->

    <div class="setting-card">

        <h3>النسخ الاحتياطي</h3>

        <div class="actions-column">

            <button
                id="backupBtn"
                class="primary"
                type="button"
                aria-label="إنشاء نسخة احتياطية">

                <i class="fas fa-download"></i>

                إنشاء نسخة احتياطية

            </button>

            <button
                id="restoreBtn"
                type="button"
                aria-label="استعادة نسخة احتياطية">

                <i class="fas fa-upload"></i>

                استعادة نسخة احتياطية

            </button>

            <input
                id="restoreFile"
                type="file"
                accept=".json"
                hidden>

        </div>

    </div>

</section>

<!-- JavaScript -->

<!-- حماية الصفحة -->

</script>

<script
