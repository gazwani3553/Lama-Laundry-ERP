    href="../assets/css/main.css">

<link
    rel="stylesheet"
    href="../assets/css/inventory.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">

<img
    src="../assets/images/logo.png"
    alt="Lama Laundry ERP Logo"
    loading="lazy">

<h2>Lama ERP</h2>

</div>

<nav>

<a href="dashboard.html">
<i class="fas fa-chart-line"></i>
<span>الرئيسية</span>
</a>

<a href="orders.html">
<i class="fas fa-basket-shopping"></i>
<span>الطلبات</span>
</a>

<a href="customers.html">
<i class="fas fa-users"></i>
<span>العملاء</span>
</a>

<a href="pickup.html">
<i class="fas fa-truck-pickup"></i>
<span>الاستلام</span>
</a>

<a href="delivery.html">
<i class="fas fa-truck-fast"></i>

</a>

<a

<i class="fas fa-boxes-stacked"></i>

<i class="fas fa-gear"></i>
<span>الإعدادات</span>
</a>

</nav>

</aside>

<main class="content">

<header class="topbar">

    <div>

        <h1>إدارة المخزون</h1>

        <p>متابعة الأصناف والكميات وحركة المخزون</p>

    </div>

    <div class="actions">

        <button
            id="refreshInventory"
            type="button"
            aria-label="تحديث بيانات المخزون">

            <i class="fas fa-rotate"></i>

            تحديث

        </button>

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
            aria-label="تسجيل الخروج">

            <i class="fas fa-right-from-bracket"></i>

            تسجيل الخروج

        </button>

        <button
            id="newItemBtn"
            class="primary"
            type="button"
            aria-label="إضافة صنف جديد">

            <i class="fas fa-plus"></i>

            إضافة صنف

        </button>

    </div>

</header>

<!-- بطاقات الإحصائيات -->

<section class="cards">

    <div class="card">

        <h2 id="itemsCount">0</h2>

        <span>عدد الأصناف</span>

    </div>

    <div class="card">

        <h2 id="lowStockCount">0</h2>

        <span>مخزون منخفض</span>

    </div>

    <div class="card">

        <h2 id="inventoryValue">0</h2>

        <span>قيمة المخزون</span>

    </div>

</section>

<!-- أدوات البحث -->

<section class="toolbar">

    <input
        id="searchItem"
        type="search"
        autocomplete="off"
        placeholder="بحث باسم الصنف أو الكود">

    <select id="stockFilter">

        <option value="">كل الأصناف</option>

        <option value="متوفر">متوفر</option>

        <option value="منخفض">منخفض</option>

        <option value="منتهي">منتهي</option>

    </select>

</section>

<!-- جدول المخزون -->

<section class="table-section">

    <table class="inventory-table">

        <thead>

            <tr>

                <th>الكود</th>
                <th>اسم الصنف</th>
                <th>الفئة</th>
                <th>الكمية</th>
                <th>الحد الأدنى</th>
                <th>سعر الوحدة</th>
                <th>الحالة</th>
                <th>الإجراءات</th>

            </tr>

        </thead>

        <tbody id="inventoryTableBody">

            <!-- inventory.js -->

        </tbody>

    </table>

</section>

<!-- نافذة إضافة / تعديل صنف -->

<div
    id="itemModal"
    class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="itemModalTitle">

                إضافة صنف

            </h2>

            <button
                id="closeItemModal"
                type="button"
                aria-label="إغلاق">

                <i class="fas fa-xmark"></i>

            </button>

        </div>

        <form id="itemForm">

            <div class="grid">

                <div class="field">

                    <label for="itemCode">

                        كود الصنف

                    </label>

                    <input
                        id="itemCode"
                        type="text"
                        required>

                </div>

                <div class="field">

                    <label for="itemName">

                        اسم الصنف

                    </label>

                    <input
                        id="itemName"
                        type="text"
                        required>

                </div>

                <div class="field">

                    <label for="itemCategory">

                        الفئة

                    </label>

                    <input
                        id="itemCategory"
                        type="text">

                </div>

                <div class="field">

                    <label for="itemQuantity">

                        الكمية

                    </label>

                    <input
                        id="itemQuantity"
                        type="number"
                        min="0"
                        required>

                </div>

                <div class="field">

                    <label for="minimumQuantity">

                        الحد الأدنى

                    </label>

                    <input
                        id="minimumQuantity"
                        type="number"
                        min="0"
                        required>

                </div>

                <div class="field">

                    <label for="unitPrice">

                        سعر الوحدة

                    </label>

                    <input
                        id="unitPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        required>

                </div>

                <div class="field full">

                    <label for="itemNotes">

                        ملاحظات

                    </label>

                    <textarea
                        id="itemNotes"
                        rows="4"></textarea>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    id="cancelItemBtn"
                    type="button">

                    إلغاء

                </button>

                <button
                    class="primary"
                    type="submit">

                    <i class="fas fa-save"></i>

                    حفظ الصنف

                </button>

            </div>

        </form>

    </div>

</div>

<!-- JavaScript -->

<!-- حماية الصفحة (التحقق من تسجيل الدخول) -->
<script
    type="module"
    src="../firebase/auth-guard.js">
</script>

<!-- تسجيل الخروج -->
<script
    type="module"
    src="../firebase/logout.js">
</script>

<!-- منطق صفحة المخزون -->
<script
    type="module"
    src="../assets/js/inventory.js">
</script>

</main>

</div>

</body>

</html>
